name: CI - Build and Push to ECR

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradlew'
      - 'gradlew.bat'
      - 'Dockerfile'
      - '.github/workflows/ci-ecr.yml'

permissions:
  contents: write
  id-token: write

env:
  AWS_REGION: ap-northeast-2
  ECR_REPOSITORY: devops-practice-backend
  DEPLOYMENT_FILE: k8s/eks/spring-deployment.yaml

jobs:
  build-push-update-manifest:
    name: Build, Push, and Update Manifest
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build Spring Boot jar
        run: ./gradlew clean build -x test

      - name: Check build output
        run: ls -al build/libs

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          role-to-assume: arn:aws:iam::131745734264:role/devops-practice-github-actions-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Check AWS identity
        run: aws sts get-caller-identity

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE_URI=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG

          echo "IMAGE_URI=$IMAGE_URI" >> $GITHUB_ENV

          docker build -t $IMAGE_URI .
          docker push $IMAGE_URI

      - name: Update Kubernetes manifest image tag
        run: |
          echo "Updating image to: $IMAGE_URI"

          sed -i "s|image: .*|image: \"$IMAGE_URI\"|g" $DEPLOYMENT_FILE

          echo "Updated deployment file:"
          grep "image:" $DEPLOYMENT_FILE

      - name: Commit and push manifest change
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add $DEPLOYMENT_FILE

          if git diff --cached --quiet; then
            echo "No manifest changes to commit."
            exit 0
          fi

          git commit -m "Update backend image to $GITHUB_SHA"
          git push