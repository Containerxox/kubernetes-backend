name: CI - Build, Push, and Update Manifest Repo

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradlew'
      - 'gradlew.bat'
      - 'Dockerfile'
      - '.github/workflows/ci-ecr.yml'

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ap-northeast-2
  ECR_REPOSITORY: devops-practice-backend

  MANIFEST_REPO_OWNER: Containerxox
  MANIFEST_REPO_NAME: kubernetes-backend-manifests
  MANIFEST_REPO_BRANCH: main
  MANIFEST_DEPLOYMENT_FILE: dev/spring-deployment.yaml

jobs:
  build-push-update-manifest:
    name: Build, Push, and Update Manifest Repo
    runs-on: ubuntu-latest

    steps:
      - name: Checkout app source code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build Spring Boot jar
        run: ./gradlew clean build -x test

      - name: Check build output
        run: ls -al build/libs

      - name: Configure AWS credentials with OIDC
        uses: aws-actions/configure-aws-credentials@v6.1.0
        with:
          role-to-assume: arn:aws:iam::131745734264:role/devops-practice-github-actions-role
          aws-region: ${{ env.AWS_REGION }}

      - name: Check AWS identity
        run: aws sts get-caller-identity

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE_URI=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          echo "IMAGE_URI=$IMAGE_URI" >> $GITHUB_ENV

          docker build -t $IMAGE_URI .
          docker push $IMAGE_URI 

          echo "Pushed image: $IMAGE_URI"

      - name: Checkout manifest repository
        uses: actions/checkout@v4
        with:
          repository: ${{ env.MANIFEST_REPO_OWNER }}/${{ env.MANIFEST_REPO_NAME }}
          ref: ${{ env.MANIFEST_REPO_BRANCH }}
          token: ${{ secrets.MANIFEST_REPO_TOKEN }}
          path: manifest-repo

      - name: Update image tag in manifest repository
        run: |
          cd manifest-repo

          echo "Updating image to: $IMAGE_URI"

          sed -i "s|image: .*|image: \"$IMAGE_URI\"|g" $MANIFEST_DEPLOYMENT_FILE

          echo "Updated deployment file:"
          grep "image:" $MANIFEST_DEPLOYMENT_FILE

      - name: Commit and push manifest changes
        run: |
          cd manifest-repo

          git config user.name "github-actions"
          git config user.email "github-actions@github.com"

          git add $MANIFEST_DEPLOYMENT_FILE

          if git diff --cached --quiet; then
            echo "No manifest changes to commit."
            exit 0
          fi

          git commit -m "Update backend image to $GITHUB_SHA"
          git push origin $MANIFEST_REPO_BRANCH